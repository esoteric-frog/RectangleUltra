<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="484" viewBox="0 0 1280 484" role="img" aria-labelledby="t d">
<title id="t">What Rectangle Ultra does</title>
<desc id="d">Six features: keyboard snapping, drag to edges, thirds sixths and eighths, multiple displays, URL scheme and config, and a build that needs no Xcode.</desc>
<style>
.card{fill:#F3FAF9;stroke:#CBE5E1;stroke-width:1.5}
.h{font:700 21px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;fill:#0B1F24}
.p{font:400 15px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;fill:#4A6468}
.scr{fill:#DDEBEA;stroke:#B8D3D0;stroke-width:1.5}
.tile{fill:#14B8A6} .cell{fill:#C7DDDA} .win{fill:#FFFFFF;stroke:#14B8A6;stroke-width:1.2} .keyb{fill:#FFFFFF;stroke:#B8D3D0}
.ink{stroke:#0F766E} .arr{stroke:#0F766E} .tilestroke{stroke:#14B8A6} .cur{fill:#0B1F24;stroke:#DDEBEA;stroke-width:1}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#0F766E}
@media (prefers-color-scheme:dark){
.card{fill:#10272B;stroke:#21444A} .h{fill:#F1FBF9} .p{fill:#9FBEC0}
.scr{fill:#0B1C20;stroke:#2A5157} .tile{fill:#2DD4BF} .cell{fill:#1B3A3F} .win{fill:#E8F5F3;stroke:#2DD4BF} .keyb{fill:#E8F5F3;stroke:#2A5157}
.ink{stroke:#0F766E} .arr{stroke:#5EEAD4} .tilestroke{stroke:#2DD4BF} .cur{fill:#F1FBF9;stroke:#0B1C20} .mono{fill:#5EEAD4}
}
</style>
<g transform="translate(40.0 40)"><rect class="card" width="384.0" height="190" rx="18"/><g transform="translate(28 28)"><rect class="scr" x="0" y="0" width="84" height="56" rx="7"/><rect class="tile" x="4" y="4" width="38" height="48" rx="3"/><g transform="translate(48 30)"><rect class="keyb" x="0" y="0" width="30" height="26" rx="6"/><path class="ink" d="M21 13 H9 M14 8 L9 13 L14 18" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text class="h" x="28" y="122">Keyboard snapping</text><text class="p" x="28" y="148">Halves, corners, maximize, center.</text><text class="p" x="28" y="170">One shortcut for each.</text></g>
<g transform="translate(448.0 40)"><rect class="card" width="384.0" height="190" rx="18"/><g transform="translate(28 28)"><rect class="scr" x="0" y="0" width="84" height="56" rx="7"/><rect x="44" y="4" width="36" height="24" rx="3" fill="none" stroke="#14B8A6" stroke-width="1.6" stroke-dasharray="4 3"/><rect class="win" x="14" y="24" width="30" height="22" rx="3"/><path class="cur" d="M56 30 L56 48 L61 43 L65 51 L68 49.500 L64 42 L71 42 Z"/></g><text class="h" x="28" y="122">Drag to edges</text><text class="p" x="28" y="148">Drag a window to an edge or corner</text><text class="p" x="28" y="170">and watch the preview appear.</text></g>
<g transform="translate(856.0 40)"><rect class="card" width="384.0" height="190" rx="18"/><g transform="translate(28 28)"><rect class="scr" x="0" y="0" width="84" height="56" rx="7"/><rect class="tile" x="4" y="4" width="24" height="24" rx="3"/><rect class="cell" x="4" y="30" width="24" height="24" rx="3"/><rect class="tile" x="30" y="4" width="24" height="24" rx="3"/><rect class="cell" x="30" y="30" width="24" height="24" rx="3"/><rect class="cell" x="56" y="4" width="24" height="24" rx="3"/><rect class="tile" x="56" y="30" width="24" height="24" rx="3"/></g><text class="h" x="28" y="122">Thirds, sixths, eighths</text><text class="p" x="28" y="148">Every Rectangle layout, plus repeated</text><text class="p" x="28" y="170">presses that cycle through sizes.</text></g>
<g transform="translate(40.0 254)"><rect class="card" width="384.0" height="190" rx="18"/><g transform="translate(28 28)"><rect class="scr" x="0" y="6" width="50" height="38" rx="6"/><rect class="tile" x="4" y="10" width="22" height="30" rx="3"/><rect class="scr" x="58" y="12" width="40" height="30" rx="5"/><rect class="tile" x="74" y="16" width="20" height="22" rx="3"/><path class="arr" d="M30 25 H50 M45 20 L51 25 L45 30" transform="translate(4 -2)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text class="h" x="28" y="122">Multiple displays</text><text class="p" x="28" y="148">Send a window to the next or</text><text class="p" x="28" y="170">previous display in one chord.</text></g>
<g transform="translate(448.0 254)"><rect class="card" width="384.0" height="190" rx="18"/><g transform="translate(28 28)"><rect class="scr" x="0" y="0" width="84" height="56" rx="7"/><text class="mono" x="42" y="36" text-anchor="middle" font-size="26" font-weight="700">{ }</text></g><text class="h" x="28" y="122">URL scheme + config</text><text class="p" x="28" y="148">rectangle-ultra://execute-action,</text><text class="p" x="28" y="170">plus JSON config import and export.</text></g>
<g transform="translate(856.0 254)"><rect class="card" width="384.0" height="190" rx="18"/><g transform="translate(28 28)"><rect class="scr" x="0" y="0" width="84" height="56" rx="7"/><path class="tilestroke" d="M16 18 L28 28 L16 38" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="tilestroke" d="M36 40 H58" stroke-width="4" stroke-linecap="round"/></g><text class="h" x="28" y="122">No Xcode build</text><text class="p" x="28" y="148">SwiftPM and the Command Line Tools.</text><text class="p" x="28" y="170">make app, and you are done.</text></g>
</svg>
